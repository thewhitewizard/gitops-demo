# La seule chose qu'on applique à la main dans tout ce dépôt.
# À partir de là, ArgoCD lit git et le cluster suit — plus aucun kubectl apply.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo
  namespace: argocd
  finalizers:
    # Supprimer l'Application supprime aussi ce qu'elle a déployé, plutôt que de
    # laisser des ressources orphelines dans le cluster.
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    # Dépôt public : ArgoCD y accède sans aucune credential. C'est la raison
    # d'être du choix « public » pour ce lab.
    repoURL: https://github.com/thewhitewizard/gitops-demo.git
    targetRevision: main
    path: deploy/overlays/dev

  destination:
    server: https://kubernetes.default.svc
    namespace: demo

  syncPolicy:
    automated:
      # prune : ce qui disparaît de git disparaît du cluster.
      prune: true
      # selfHeal : une modification faite à la main dans le cluster est annulée.
      # Git est la source de vérité, y compris contre l'opérateur.
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
