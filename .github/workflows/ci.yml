# Contrôle des pull requests : on vérifie que le code compile, passe les tests et
# produit une image — mais on ne publie rien. Seul un merge sur main déploie.
name: ci

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race ./...

      # Build sans push : on veut savoir que le Dockerfile est cassé avant le merge,
      # pas après.
      - name: docker build
        run: docker build --build-arg VERSION=pr-${{ github.event.number }} -t gitops-demo:pr .
