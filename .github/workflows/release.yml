# Le cœur de la démo : un merge sur main publie une image et met à jour le manifest.
# Personne ne déploie — ArgoCD lit le résultat dans git et se charge du reste.
name: release

on:
  push:
    branches: [main]
    # Sans ce paths-ignore, le commit de bump écrit par le job « bump » relancerait
    # ce même workflow, qui écrirait un nouveau bump, à l'infini.
    # (Deuxième garde-fou, par construction : un push authentifié avec GITHUB_TOKEN
    # ne déclenche aucun workflow. Les deux mécanismes se couvrent mutuellement,
    # et le second saute dès qu'on passe à un PAT.)
    paths-ignore:
      - "deploy/**"
      - "**.md"

# Deux merges rapprochés écriraient sur main en même temps : on sérialise.
# cancel-in-progress reste à false, sinon une image serait publiée sans que son
# manifest ne soit jamais mis à jour.
concurrency:
  group: release-main
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # publier sur GHCR
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race ./...

      # Le tag d'image est le SHA du commit : immuable, et il remonte directement
      # au code qui tourne. Pas de :latest qui se déplace sous les pieds du cluster.
      - name: Calculer le tag
        id: meta
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: VERSION=${{ steps.meta.outputs.tag }}
          # :latest n'est là que pour le confort humain (docker pull sans réfléchir).
          # C'est le tag SHA que le cluster déploie.
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  bump:
    needs: build-push
    runs-on: ubuntu-latest
    permissions:
      contents: write # commiter la mise à jour du manifest sur main
    steps:
      - uses: actions/checkout@v4
        with:
          # GITHUB_TOKEN suffit dans le cas nominal. Le PAT ne devient nécessaire
          # que si main est protégée par une branch protection — voir le README,
          # section « Tokens et permissions GitHub ».
          token: ${{ secrets.GITOPS_PAT || secrets.GITHUB_TOKEN }}

      - name: Installer kustomize
        run: |
          curl -sSL "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Pointer l'overlay sur la nouvelle image
        working-directory: deploy/overlays/dev
        run: kustomize edit set image ${{ env.IMAGE }}:${{ needs.build-push.outputs.tag }}

      - name: Commiter le bump
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "Aucun changement : l'overlay pointe déjà sur cette image."
            exit 0
          fi

          git commit -am "chore(deploy): image ${{ needs.build-push.outputs.tag }}"
          # Un autre merge a pu passer pendant le build : on se rebase avant de pousser.
          git pull --rebase origin main
          git push origin HEAD:main
